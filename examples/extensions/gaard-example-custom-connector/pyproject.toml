[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaard-example-custom-connector"
version = "2.0.7"
description = "Public example datasource connector for the GAARD extension platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gaard-connectors>=2.0.7,<2.1.0",
    "gaard-plugin-api>=2.0.7,<2.1.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.entry-points."gaard.extensions"]
example-custom-connector = "gaard_example_custom_connector.plugin:extension"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
