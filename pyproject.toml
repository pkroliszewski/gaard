[tool.pytest.ini_options]
testpaths = [
    "packages/gaard-plugin-api/tests",
    "packages/gaard-core/tests",
    "packages/gaard-connectors/tests",
    "packages/gaard-llm/tests",
    "packages/gaard-api/tests",
    "packages/gaard-client/tests"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.param_functions.Depends",
    "fastapi.param_functions.File",
    "fastapi.params.Depends",
    "fastapi.params.File",
]

[tool.mypy]
python_version = "3.12"
strict = true
