[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaard-extract"
version = "0.2.2"
description = "GAARD Unstructured Data Extract plugin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gaard-api>=0.2.2,<0.3.0",
    "gaard-plugin-api>=0.2.2,<0.3.0",
    "httpx2>=2.5.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.entry-points."gaard.extensions"]
gaard-extract = "gaard_extract.plugin:extension"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaard_extract = [
    "admin/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
