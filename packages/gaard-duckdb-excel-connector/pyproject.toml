[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaard-duckdb-excel-connector"
version = "0.2.0"
description = "Private DuckDB Excel datasource connector for GAARD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4.0,<1.5.0",
    "duckdb-engine>=0.17.0,<0.18.0",
    "gaard-connectors>=0.2.0,<0.3.0",
    "gaard-plugin-api>=0.2.0,<0.3.0",
    "openpyxl>=3.1.0,<4.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.entry-points."gaard.extensions"]
duckdb-excel-connector = "gaard_duckdb_excel_connector.plugin:extension"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaard_duckdb_excel_connector = ["admin/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
