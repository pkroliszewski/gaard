[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaard-client"
version = "0.2.9"
description = "GAARD frontend web services providing client interface"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "gaard-plugin-api>=0.2.9,<0.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx2>=2.5.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
gaard-client = "gaard_client.cli:main"

[project.entry-points."gaard.commands"]
client = "gaard_client.cli_commands:register"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaard_client = [
    "client-web/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.param_functions.Depends", "fastapi.param_functions.File", "fastapi.params.Depends", "fastapi.params.File"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["PYI034", "PYI036"]

[tool.pytest.ini_options]
testpaths = ["tests"]
