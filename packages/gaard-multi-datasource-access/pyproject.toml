[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaard-multi-datasource-access"
version = "0.2.2"
description = "GAARD Multi-datasource-access extension"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gaard-api>=0.2.2,<0.3.0",
    "gaard-plugin-api>=0.2.2,<0.3.0",
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.entry-points."gaard.extensions"]
datasource-access = "gaard_multi_datasource_access.plugin:extension"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaard_multi_datasource_access = ["admin/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
