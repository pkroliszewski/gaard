<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multi Datasource Access</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #ffffff;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #ffffff;
    }

    main {
      max-width: 760px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
    }

    p {
      margin: 0;
      color: #536174;
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      margin-bottom: 18px;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      padding: 5px 10px;
      color: #31558f;
      background: #eef4ff;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Multi Datasource Access</h1>
    <p>
      Multi Datasource Access enables enterprise deployments to keep multiple
      datasources active, combine their schema context for SQL generation, and route
      generated SQL to the matching connector. There is no configuration for this
      extension yet.
    </p>
  </main>
  <script>
    function postHeight() {
      window.parent?.postMessage({
        type: "gaard:extension:height",
        height: document.documentElement.scrollHeight
      }, window.location.origin);
    }
    window.addEventListener("load", postHeight);
    window.addEventListener("resize", postHeight);
  </script>
</body>
</html>
