[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaard-api"
version = "0.2.3"
description = "GAARD backend web services providing admin interface"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "gaard-core==0.2.2",
    "gaard-connectors==0.2.2",
    "gaard-llm==0.2.2",
    "gaard-plugin-api>=0.2.2,<0.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "httpx2>=2.5.0",
    "certifi>=2024.8.30"
]

[project.optional-dependencies]
oracle = ["oracledb>=2.0.0"]
mssql = ["pyodbc>=5.0.0"]
ibm_db2 = ["ibm-db-sa>=0.4.4"]
teradata = ["teradatasqlalchemy>=20.0.0.9"]
all-datasources = [
    "oracledb>=2.0.0",
    "pyodbc>=5.0.0",
    "ibm-db-sa>=0.4.4",
    "teradatasqlalchemy>=20.0.0.9",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "psycopg[binary]>=3.2.0",
    "pymysql>=1.2.0",
]

#
# API owns the main CLI
#
[project.scripts]
gaard = "gaard_api.cli:main"
gaard-api = "gaard_api.server_cli:main"
gaard-core = "gaard_api.server_cli:main"

#
# Registers "admin" command
#
[project.entry-points."gaard.commands"]
admin = "gaard_api.cli_commands:register"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaard_api = [
    "admin-web/**/*",
    "example_data/medical_poc/*.sql",
]

[tool.setuptools.exclude-package-data]
gaard_api = [
    "**/__pycache__/*",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
