[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaard-connectors"
version = "2.0.7"
description = "Database connectors for GAARD based on SQLAlchemy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gaard-core==2.0.7",
    "gaard-plugin-api>=2.0.7,<2.1.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
mysql = ["pymysql>=1.1.0"]
oracle = ["oracledb>=2.0.0"]
mssql = ["pyodbc>=5.0.0"]
ibm_db2 = ["ibm-db-sa>=0.4.4"]
teradata = ["teradatasqlalchemy>=20.0.0.9"]
all-datasources = [
    "psycopg[binary]>=3.2.0",
    "pymysql>=1.1.0",
    "oracledb>=2.0.0",
    "pyodbc>=5.0.0",
    "ibm-db-sa>=0.4.4",
    "teradatasqlalchemy>=20.0.0.9",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
