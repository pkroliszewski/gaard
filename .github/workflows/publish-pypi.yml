name: Publish Python packages to PyPI

on:
  push:
    tags:
      - "v*"
      - "gaard-plugin-api-v*"
      - "gaard-core-v*"
      - "gaard-connectors-v*"
      - "gaard-llm-v*"
      - "gaard-api-v*"
      - "gaard-client-v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release-package: ${{ steps.release.outputs.package }}
      release-version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out public repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release target
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          packages = [
              "gaard-plugin-api",
              "gaard-core",
              "gaard-connectors",
              "gaard-llm",
              "gaard-api",
              "gaard-client",
          ]

          tag = sys.argv[1]
          if tag.startswith("v"):
              release_package = "all"
              release_version = tag[1:]
          else:
              matches = [
                  (package, tag[len(f"{package}-v"):])
                  for package in packages
                  if tag.startswith(f"{package}-v")
              ]
              if len(matches) != 1:
                  allowed = "vX.Y.Z or <package>-vX.Y.Z"
                  raise SystemExit(f"Unsupported release tag {tag!r}; expected {allowed}.")
              release_package, release_version = matches[0]

          if not re.fullmatch(r"[0-9][0-9A-Za-z._-]*", release_version):
              raise SystemExit(
                  f"Unsupported release version {release_version!r}; "
                  "expected something like 0.1.0 or 0.2.0rc1."
              )

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              print(f"package={release_package}", file=output)
              print(f"version={release_version}", file=output)

          if release_package == "all":
              print(f"Release {tag} will publish all GAARD packages.")
          else:
              print(f"Release {tag} will publish only {release_package}.")
          PY

      - name: Verify release target matches package versions
        env:
          RELEASE_PACKAGE: ${{ steps.release.outputs.package }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - "$RELEASE_PACKAGE" "$RELEASE_VERSION" <<'PY'
          from pathlib import Path
          import sys
          import tomllib

          release_package = sys.argv[1]
          expected_version = sys.argv[2]
          pyprojects_by_package = {
              "gaard-plugin-api": Path("packages/gaard-plugin-api/pyproject.toml"),
              "gaard-core": Path("packages/gaard-core/pyproject.toml"),
              "gaard-connectors": Path("packages/gaard-connectors/pyproject.toml"),
              "gaard-llm": Path("packages/gaard-llm/pyproject.toml"),
              "gaard-api": Path("packages/gaard-api/pyproject.toml"),
              "gaard-client": Path("packages/gaard-client/pyproject.toml"),
          }

          if release_package == "all":
              selected = pyprojects_by_package.values()
          else:
              try:
                  selected = [pyprojects_by_package[release_package]]
              except KeyError:
                  raise SystemExit(f"Unknown release package: {release_package}") from None

          mismatches = []
          for pyproject in selected:
              with pyproject.open("rb") as source:
                  package = tomllib.load(source)["project"]
              version = package["version"]
              if version != expected_version:
                  mismatches.append(f"{package['name']}: {version}")

          if mismatches:
              details = ", ".join(mismatches)
              raise SystemExit(
                  f"Release expects version {expected_version}; mismatches: {details}"
              )

          if release_package == "all":
              print(f"All packages match release version {expected_version}.")
          else:
              print(f"{release_package} matches release version {expected_version}.")
          PY

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Build and check distributions
        env:
          RELEASE_PACKAGE: ${{ steps.release.outputs.package }}
        run: |
          if [ "$RELEASE_PACKAGE" = "all" ]; then
            ./scripts/build.sh --python python
          else
            ./scripts/build.sh --python python --package "$RELEASE_PACKAGE"
          fi

      - name: Smoke-test built distributions in a clean environment
        env:
          RELEASE_PACKAGE: ${{ steps.release.outputs.package }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m venv /tmp/gaard-release-smoke
          /tmp/gaard-release-smoke/bin/python -m pip install --upgrade pip
          if [ "$RELEASE_PACKAGE" = "all" ]; then
            /tmp/gaard-release-smoke/bin/python -m pip install dist/*.whl
          else
            wheel_prefix="${RELEASE_PACKAGE//-/_}"
            wheel_path="$(find dist -maxdepth 1 -name "${wheel_prefix}-*.whl" -print -quit)"
            if [ -z "$wheel_path" ]; then
              echo "No wheel found for $RELEASE_PACKAGE." >&2
              exit 1
            fi
            /tmp/gaard-release-smoke/bin/python -m pip install "$wheel_path"
          fi
          /tmp/gaard-release-smoke/bin/python -m pip check
          /tmp/gaard-release-smoke/bin/python - <<'PY'
          from importlib import import_module
          from importlib.metadata import version
          import os

          release_package = os.environ["RELEASE_PACKAGE"]
          release_version = os.environ["RELEASE_VERSION"]
          modules = {
              "gaard-plugin-api": "gaard_plugin_api",
              "gaard-core": "gaard_core",
              "gaard-connectors": "gaard_connectors",
              "gaard-llm": "gaard_llm",
              "gaard-api": "gaard_api",
              "gaard-client": "gaard_client",
          }
          selected = modules if release_package == "all" else {release_package: modules[release_package]}
          for package, module in selected.items():
              installed_version = version(package)
              if installed_version != release_version:
                  raise SystemExit(
                      f"{package} installed as {installed_version}, expected {release_version}."
                  )
              import_module(module)

          if release_package in {"all", "gaard-api", "gaard-connectors"}:
              from gaard_connectors.registry import ConnectorDefinition

              required_fields = {
                  "preview_connection_tester",
                  "datasource_url_finalizer",
                  "datasource_deleter",
              }
              missing = required_fields - ConnectorDefinition.__dataclass_fields__.keys()
              if missing:
                  raise SystemExit(f"ConnectorDefinition is missing release fields: {sorted(missing)}")
          PY

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
