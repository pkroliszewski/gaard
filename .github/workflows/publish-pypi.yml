name: Publish Python packages to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out public repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release tag matches package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          from pathlib import Path
          import sys
          import tomllib

          tag = sys.argv[1]
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with v: {tag}")

          expected_version = tag[1:]
          pyprojects = [
              Path("packages/gaard-core/pyproject.toml"),
              Path("packages/gaard-connectors/pyproject.toml"),
              Path("packages/gaard-llm/pyproject.toml"),
              Path("packages/gaard-api/pyproject.toml"),
              Path("packages/gaard-client/pyproject.toml"),
          ]

          mismatches = []
          for pyproject in pyprojects:
              with pyproject.open("rb") as source:
                  package = tomllib.load(source)["project"]
              version = package["version"]
              if version != expected_version:
                  mismatches.append(f"{package['name']}: {version}")

          if mismatches:
              details = ", ".join(mismatches)
              raise SystemExit(
                  f"Tag {tag} expects version {expected_version}; mismatches: {details}"
              )

          print(f"All packages match release {tag}.")
          PY

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Build and check distributions
        run: ./scripts/build.sh --python python

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
